# Netlify configuration.
#
# NOTE: myelomarisk.com was previously configured entirely through the Netlify
# UI (there was no netlify.toml in the repo). The [build] block below is written
# to match Netlify's defaults for this project so production behaviour does not
# change. Confirm it against the site's UI settings before merging — a
# netlify.toml overrides the UI.

[build]
  command = "npm run build"
  publish = "dist"

# Reviewer preview site (deploy.myelomarisk.com).
#
# Branch deploys of `preview` build with the reviewer password compiled in, so
# calculators awaiting clinical sign-off are reachable at /#/preview. Production
# never gets the password — see docs/REVIEWER_PREVIEW.md.
[context.branch-deploy]
  command = "npm run build:preview"

[context.deploy-preview]
  command = "npm run build:preview"

# Keep every non-production deploy out of search results.
[[context.branch-deploy.headers]]
  for = "/*"
  [context.branch-deploy.headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[context.deploy-preview.headers]]
  for = "/*"
  [context.deploy-preview.headers.values]
    X-Robots-Tag = "noindex, nofollow"
