# Netlify configuration.
#
# myelomarisk.com was previously configured entirely through the Netlify UI
# (there was no netlify.toml in the repo). The [build] block below matches the
# dashboard's settings exactly (verified 2026-09-06: build command
# `npm run build`, publish directory `dist`), so production behaviour is
# unchanged. A netlify.toml overrides the UI, so keep the two in step.

[build]
  command = "npm run build"
  publish = "dist"

# Reviewer preview site (deploy.myelomarisk.com).
#
# Branch deploys of `deploy` build with the reviewer password compiled in, so
# calculators awaiting clinical sign-off are reachable at /#/preview. Production
# never gets the password — see docs/REVIEWER_PREVIEW.md.
[context.branch-deploy]
  command = "npm run build:preview"

[context.deploy-preview]
  command = "npm run build:preview"

# NOTE: headers in netlify.toml are global and are NOT evaluated per deploy
# context, so the noindex header for previews cannot be set here without also
# deindexing production. `npm run build:preview` writes dist/_headers instead
# (scripts/preview-headers.mjs).
